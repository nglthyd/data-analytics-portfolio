<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 317" role="img" aria-labelledby="title desc"><title id="title">运营分组的90天商品GMV</title><desc id="desc">仅合格可观测商家计金额；高贡献采用正GMV商家q75阈值，是描述性分组，非行业标准。</desc><style>text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#173046;font-size:15px}.heading{font-size:22px;font-weight:700}.note{fill:#5B6E79;font-size:13px}.grid{stroke:#DEE6E8;stroke-width:1}</style><rect width="760" height="100%" fill="#fff"/><text x="28" y="36" class="heading">运营分组的90天商品GMV</text><text x="28" y="94">高贡献已激活</text><rect x="225" y="76" width="395.000" height="26" rx="3" fill="#006D68"/><text x="627.000" y="95">213,783.87R$</text><text x="28" y="142">其他已激活</text><rect x="225" y="124" width="88.468" height="26" rx="3" fill="#006D68"/><text x="320.468" y="143">47,881.17R$</text><text x="28" y="190">可观测但未激活</text><rect x="225" y="172" width="0.000" height="26" rx="3" fill="#006D68"/><text x="232.000" y="191">0.00R$</text><text x="28" y="254" class="note">仅合格可观测商家计金额；高贡献采用正GMV商家q75阈值，是描述性分组，非行</text><text x="28" y="275" class="note">业标准。</text></svg>